  :root {
    --bg: #f2f3f0;
    --page-bg: #e3e5df;
    --surface: #ffffff;
    --text-main: #2A2A2A;
    --muted: #6b6f76;
    --accent: #2B6CB0;
    --accent-contrast: #ffffff;
    --border: rgba(42,42,42,0.13);
    --success: #2e7d32;
    --success-bg: #e8f5e9;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --sleeve: #939aa6;
    --hose: #33291f;
    --shadow: 0 24px 48px -20px rgba(30,32,26,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --page-bg: #0a0c10;
      --surface: #1c2029;
      --text-main: #e7e9ee;
      --muted: #9aa0ab;
      --accent: #4d8fd6;
      --accent-contrast: #0b0d12;
      --border: rgba(231,233,238,0.14);
      --success: #4caf50;
      --success-bg: rgba(76,175,80,0.16);
      --danger: #e57373;
      --danger-bg: rgba(229,115,115,0.16);
      --sleeve: #6b7280;
      --hose: #d9cdbf;
      --shadow: 0 24px 48px -18px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --page-bg: #0a0c10; --surface: #1c2029; --text-main: #e7e9ee;
    --muted: #9aa0ab; --accent: #4d8fd6; --accent-contrast: #0b0d12;
    --border: rgba(231,233,238,0.14); --success: #4caf50; --success-bg: rgba(76,175,80,0.16);
    --danger: #e57373; --danger-bg: rgba(229,115,115,0.16); --sleeve: #6b7280; --hose: #d9cdbf;
    --shadow: 0 24px 48px -18px rgba(0,0,0,0.6);
  }
  :root[data-theme="light"] {
    --bg: #f2f3f0; --page-bg: #e3e5df; --surface: #ffffff; --text-main: #2A2A2A;
    --muted: #6b6f76; --accent: #2B6CB0; --accent-contrast: #ffffff;
    --border: rgba(42,42,42,0.13); --success: #2e7d32; --success-bg: #e8f5e9;
    --danger: #c0392b; --danger-bg: #fdecea; --sleeve: #939aa6; --hose: #33291f;
    --shadow: 0 24px 48px -20px rgba(30,32,26,0.35);
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }

  .outer-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vw, 36px);
    padding: clamp(20px, 5vw, 48px) 16px 56px;
  }

  .preview-header { max-width: 460px; text-align: center; position: relative; width: 100%; }
  .preview-eyebrow {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 8px;
  }
  .preview-title {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(22px, 4vw, 28px);
    margin: 0 0 10px; text-wrap: balance;
  }
  .preview-note {
    font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0 auto;
    max-width: 40ch;
  }
  .theme-toggle {
    position: absolute; top: -4px; right: 0;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-main);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .phone-frame {
    width: min(92vw, 366px);
    background: #14151a;
    border-radius: 46px;
    padding: 14px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .phone-notch {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 20px; background: #14151a; border-radius: 0 0 14px 14px; z-index: 3;
  }
  .phone-screen {
    background: var(--bg);
    border-radius: 32px;
    height: min(78vh, 700px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .phone-home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.55); z-index: 3;
  }

  .app-bar {
    flex: 0 0 auto;
    height: 60px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 0 4px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: 14px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent;
    color: var(--text-main); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn[style*="hidden"] { pointer-events: none; }
  .app-bar-titlewrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .app-bar-title {
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .step-dots { display: flex; gap: 5px; }
  .step-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .step-dots .dot.is-active { background: var(--accent); }

  .app-content {
    flex: 1 1 auto; overflow-y: auto; padding: 18px 18px 8px;
  }
  .app-bottombar {
    flex: 0 0 auto; padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border); background: var(--surface);
  }
  .app-bottombar.is-empty { display: none; }

  .screen-lead { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }

  .btn-primary, .btn-secondary, .btn-outline {
    font-weight: 600; font-size: 15px; border-radius: 13px; border: none; cursor: pointer;
    padding: 13px 18px; width: 100%; display: block; text-align: center;
    font-family: 'Montserrat', sans-serif;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--bg); color: var(--text-main); border: 1px solid var(--border); margin-bottom: 14px; }
  .btn-outline { background: transparent; color: var(--text-main); border: 1.5px solid var(--border); }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-outline:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .home-hero { text-align: center; padding: 22px 0 18px; }
  .home-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.02em; }
  .home-logo span { color: var(--accent); }
  .home-logo-sub { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin: 4px 0 10px;
  }
  .tool-card {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; text-align: left; cursor: pointer;
  }
  .tool-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool-icon {
    width: 40px; height: 40px; border-radius: 11px; background: var(--bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .tool-icon svg { width: 20px; height: 20px; }
  .tool-copy { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tool-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14.5px; }
  .tool-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .tool-chevron { color: var(--muted); flex: 0 0 auto; }
  .tool-chevron svg { width: 18px; height: 18px; }
  .tool-card--soon { cursor: default; opacity: 0.6; }
  .badge-soon {
    font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 9px; flex: 0 0 auto; text-transform: uppercase; letter-spacing: 0.04em;
  }

  .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .brand-card {
    position: relative; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    min-height: 58px;
  }
  .brand-card.is-selected { border-color: var(--accent); background: var(--success-bg); }
  .brand-card.is-selected { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .brand-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13.5px; text-align: center; }
  .brand-check {
    position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); color: var(--accent-contrast); display: none; align-items: center; justify-content: center;
  }
  .brand-card.is-selected .brand-check { display: flex; }
  .brand-check svg { width: 10px; height: 10px; }
  .brand-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .brand-list { list-style: none; margin: 0 0 18px; padding: 0; border-top: 1px solid var(--border); }
  .brand-row {
    display: flex; align-items: center; justify-content: space-between; padding: 13px 2px;
    border-bottom: 1px solid var(--border); font-size: 14.5px; font-weight: 500;
  }
  .danger-btn { color: var(--danger); }
  .add-brand-row { display: flex; gap: 8px; }
  .add-brand-row input {
    flex: 1 1 auto; min-width: 0; border: 1px solid var(--border); border-radius: 11px;
    padding: 11px 12px; font-size: 14px; background: var(--surface); color: var(--text-main);
  }
  .add-brand-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-brand-row .btn-secondary { width: auto; margin-bottom: 0; padding: 11px 16px; white-space: nowrap; }
  .empty-hint { font-size: 13px; color: var(--muted); padding: 14px 2px; }

  .fitting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fitting-card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px 10px; cursor: pointer; text-align: center;
  }
  .fitting-card.is-selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .fitting-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fitting-name { display: block; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.02em; }
  .fitting-hint { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .socket-result { margin-top: 18px; animation: reveal 0.25s ease; }
  .socket-result-label { font-size: 13px; margin-bottom: 8px; }
  .socket-result-label strong { font-family: 'Montserrat', sans-serif; color: var(--accent); font-weight: 700; }
  .socket-illustration {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px;
  }
  .socket-illustration svg { width: 100%; height: auto; display: block; }
  .socket-caption { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  .field { display: block; margin-bottom: 14px; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field-inputwrap {
    display: flex; align-items: center; border: 1px solid var(--border); border-radius: 13px;
    background: var(--surface); padding: 4px 14px;
  }
  .field-inputwrap input {
    flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: var(--text-main);
    font-size: 17px; padding: 10px 0; font-variant-numeric: tabular-nums;
  }
  .field-inputwrap input:focus { outline: none; }
  .field-inputwrap:focus-within { border-color: var(--accent); }
  .field-suffix { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field-error { font-size: 12.5px; color: var(--danger); margin: -6px 0 12px; }

  .calc-btn { margin-top: 4px; }

  .result-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-top: 6px; animation: reveal 0.25s ease;
  }
  .result-card.is-stale { opacity: 0.4; }
  .result-row { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; padding: 5px 0; font-variant-numeric: tabular-nums; }
  .result-row .tag {
    font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border);
    border-radius: 20px; padding: 1px 7px; margin-left: 6px;
  }
  .result-divider { height: 1px; background: var(--border); margin: 8px 0; }
  .result-hero { display: flex; align-items: baseline; justify-content: space-between; padding-top: 2px; }
  .result-hero span:first-child { font-size: 13px; font-weight: 600; color: var(--muted); }
  .result-hero-value {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 27px; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .confirm-screen { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 4px 8px; gap: 18px; }
  .confirm-icon { width: 92px; height: 92px; color: var(--accent); }
  .confirm-icon svg { width: 100%; height: 100%; }
  .confirm-question { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.4; text-wrap: balance; }
  .confirm-actions { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
  .confirm-actions button { width: auto; flex: 1 1 0; }

  .banner {
    display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
    padding: 14px; border-radius: 13px; font-size: 13.5px; width: 100%;
  }
  .banner-danger { background: var(--danger-bg); color: var(--danger); }
  .banner-dismiss {
    border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 9px;
    padding: 7px 16px; font-weight: 600; font-size: 12.5px; cursor: pointer;
  }

  .outcome-screen { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 6px 8px; gap: 16px; }
  .outcome-icon { width: 96px; height: 96px; }
  .outcome-icon svg { width: 100%; height: 100%; }
  .outcome-success .outcome-icon { color: var(--success); }
  .outcome-fail .outcome-icon { color: var(--danger); }
  .outcome-title { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: 0.01em; }
  .outcome-success .outcome-title { color: var(--success); }
  .outcome-fail .outcome-title { color: var(--danger); }
  .outcome-body { font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 26ch; }
  .outcome-screen .btn-primary { margin-top: 8px; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  }
  @media (prefers-reduced-motion: reduce) {
    .socket-result, .result-card { animation: none; }
  }
</style>

<body>

  <div class="phone-frame">

            <line x1="5.05" y1="5.05" x2="7.17" y2="7.17"/><line x1="16.83" y1="16.83" x2="18.95" y2="18.95"/>

</div>

<script>
(function(){
  "use strict";

  var ICONS = {
    ruler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><line x1="7" y1="8" x2="7" y2="11"/><line x1="11" y1="8" x2="11" y2="12"/><line x1="15" y1="8" x2="15" y2="11"/><line x1="19" y1="8" x2="19" y2="12"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/></svg>',
    gauge: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="10" x2="8" y2="38"/><line x1="40" y1="10" x2="40" y2="38"/><line x1="8" y1="24" x2="40" y2="24"/><line x1="24" y1="16" x2="24" y2="32"/><line x1="20" y1="16" x2="28" y2="16"/><line x1="20" y1="32" x2="28" y2="32"/></svg>',
    checkCircleBig: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="3"/><path d="M20 33l8 8 16-18" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    xCircleBig: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="3"/><line x1="22" y1="22" x2="42" y2="42" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><line x1="42" y1="22" x2="22" y2="42" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 14.5A8.5 8.5 0 0110 3.2 8.5 8.5 0 1020 14.5z"/></svg>'
  };

  function socketSvg(kind){
    var hoseRect = '<rect x="8" y="35" width="204" height="40" rx="18" fill="var(--hose)"/>';
    var capLeft = '<rect x="12" y="8" width="10" height="94" rx="4" fill="var(--sleeve)"/>';
    var topWall = '<rect x="20" y="10" width="182" height="25" rx="4" fill="var(--sleeve)"/>';
    var botWall = '<rect x="20" y="75" width="182" height="25" rx="4" fill="var(--sleeve)"/>';
    var mid;
    if (kind === 'INTERLOCK') {
      mid = '<polyline points="30,35 50,35 50,29 70,29 70,35 90,35 90,29 110,29 110,35 130,35 130,29 150,29 150,35 170,35 170,29 190,29 190,35" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/>' +
            '<polyline points="30,75 50,75 50,81 70,81 70,75 90,75 90,81 110,81 110,75 130,75 130,81 150,81 150,75 170,75 170,81 190,81 190,75" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/>';
    } else {
      mid = '<line x1="20" y1="35" x2="202" y2="35" stroke="var(--bg)" stroke-width="2"/>' +
            '<line x1="20" y1="75" x2="202" y2="75" stroke="var(--bg)" stroke-width="2"/>';
    }
    return '<svg viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">' + hoseRect + capLeft + topWall + botWall + mid + '</svg>';
  }

  var BRAND_KEY = 'hbBrands_v1';
  var THEME_KEY = 'hbTheme';
  var DEFAULT_BRANDS = ['SEL','DUNLOP','MANULİ','GATES','ALFAGOMMA'];

  function loadBrands(){
    try {
      var raw = localStorage.getItem(BRAND_KEY);
      if (!raw) { localStorage.setItem(BRAND_KEY, JSON.stringify(DEFAULT_BRANDS)); return DEFAULT_BRANDS.slice(); }
      var parsed = JSON.parse(raw);
      return (Array.isArray(parsed) && parsed.length) ? parsed : DEFAULT_BRANDS.slice();
    } catch (e) { return DEFAULT_BRANDS.slice(); }
  }
  function saveBrands(list){ localStorage.setItem(BRAND_KEY, JSON.stringify(list)); }

  var state = {
    screen: 'home',
    brands: loadBrands(),
    selectedBrand: null,
    fitting: null,
    hortumDis: '',
    soketIc: '',
    measureError: null,
    calc: null,
    calcStale: false,
    gaugeWarning: false,
    pressStage: 'ask'
  };

  var SCREEN_META = {
    home: { title: 'FIBAR', back: null, gear: false, step: 0 },
    brand: { title: 'Marka Seç', back: 'home', gear: true, step: 1 },
    brandManage: { title: 'Marka Yönet', back: 'brand', gear: false, step: 0 },
    fitting: { title: 'Rakor Tipi Seç', back: 'brand', gear: false, step: 2 },
    measure: { title: 'Ölçüleri Gir', back: 'fitting', gear: false, step: 3 },
    gauge: { title: 'Kontrol', back: 'measure', gear: false, step: 0 },
    press: { title: 'Basım Kontrolü', back: 'gauge', gear: false, step: 0 }
  };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function parseNum(v){
    if (v === null || v === undefined) return NaN;
    return parseFloat(String(v).trim().replace(',', '.'));
  }
  function fmt(n){
    var s = n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    if (s === '' || s === '-') s = '0';
    return s.replace('.', ',');
  }
  function stepDotsHtml(active){
    if (!active) return '';
    var html = '';
    for (var i = 1; i <= 3; i++) html += '<span class="dot' + (i <= active ? ' is-active' : '') + '"></span>';
    return '<div class="step-dots">' + html + '</div>';
  }

  function renderHome(){
    return '' +
      '<div class="home-hero">' +
        '<div class="home-logo">FIBAR <span>HİDROLİK</span></div>' +
        '<div class="home-logo-sub">Hortum Araçları</div>' +
      '</div>' +
      '<div class="section-label">Araçlar</div>' +
      '<button class="tool-card" data-action="go-brand">' +
        '<span class="tool-icon">' + ICONS.ruler + '</span>' +
        '<span class="tool-copy">' +
          '<span class="tool-title">Hortum Basım Ölçüsü Hesapla</span>' +
          '<span class="tool-sub">Marka, rakor tipi ve ölçülere göre basım ölçüsünü hesaplar</span>' +
        '</span>' +
        '<span class="tool-chevron">' + ICONS.chevronRight + '</span>' +
      '</button>' +
      '<div class="tool-card tool-card--soon" aria-disabled="true">' +
        '<span class="tool-icon">' + ICONS.list + '</span>' +
        '<span class="tool-copy">' +
          '<span class="tool-title">Hazır Basım Ölçüleri</span>' +
          '<span class="tool-sub">Sabit ölçülü hortumlar için hızlı bakış listesi</span>' +
        '</span>' +
        '<span class="badge-soon">Yakında</span>' +
      '</div>';
  }

  function renderBrand(){
    var cards = state.brands.map(function(b){
      var sel = b === state.selectedBrand;
      return '<button class="brand-card' + (sel ? ' is-selected' : '') + '" data-action="select-brand" data-value="' + esc(b) + '">' +
        '<span class="brand-name">' + esc(b) + '</span>' +
        '<span class="brand-check">' + ICONS.check + '</span>' +
      '</button>';
    }).join('');
    return '<p class="screen-lead">Basımını yapacağınız hortumun markasını seçin.</p><div class="brand-grid">' + cards + '</div>';
  }

  function renderBrandManage(){
    var rows = state.brands.map(function(b){
      return '<li class="brand-row"><span>' + esc(b) + '</span>' +
        '<button class="icon-btn danger-btn" data-action="delete-brand" data-value="' + esc(b) + '" aria-label="Sil">' + ICONS.trash + '</button></li>';
    }).join('');
    var list = state.brands.length ? ('<ul class="brand-list">' + rows + '</ul>') : '<p class="empty-hint">Henüz marka eklenmedi.</p>';
    return '<p class="screen-lead">Marka listesini düzenleyin. Değişiklikler bu cihazda saklanır.</p>' +
      list +
      '<div class="add-brand-row">' +
        '<input id="newBrandInput" type="text" placeholder="Yeni marka adı" maxlength="30" />' +
        '<button class="btn-secondary" data-action="add-brand">Ekle</button>' +
      '</div>';
  }

  function renderFitting(){
    var f = state.fitting;
    var result = '';
    if (f) {
      var label = f === 'INTERLOCK' ? 'INTERLOCK SOKET' : 'SIYIRMALI SOKET';
      var caption = f === 'INTERLOCK' ? 'Kademeli (basamaklı) iç yüzey' : 'Düz, tırtıksız iç yüzey';
      result = '<div class="socket-result">' +
        '<div class="socket-result-label">Soket: <strong>' + label + '</strong></div>' +
        '<div class="socket-illustration">' + socketSvg(f) + '</div>' +
        '<div class="socket-caption">' + caption + '</div>' +
      '</div>';
    }
    return '<p class="screen-lead">Rakor tipine göre soket otomatik seçilir.</p>' +
      '<div class="fitting-grid">' +
        '<button class="fitting-card' + (f === 'INTERLOCK' ? ' is-selected' : '') + '" data-action="select-fitting" data-value="INTERLOCK">' +
          '<span class="fitting-name">INTERLOCK</span><span class="fitting-hint">Kademeli soket</span></button>' +
        '<button class="fitting-card' + (f === 'SIYIRMALI' ? ' is-selected' : '') + '" data-action="select-fitting" data-value="SIYIRMALI">' +
          '<span class="fitting-name">SIYIRMALI</span><span class="fitting-hint">Düz soket</span></button>' +
      '</div>' + result;
  }

  function renderMeasure(){
    var errorHtml = state.measureError ? ('<div class="field-error">' + esc(state.measureError) + '</div>') : '';
    var resultHtml = '';
    if (state.calc) {
      var c = state.calc;
      resultHtml = '<div class="result-card' + (state.calcStale ? ' is-stale' : '') + '">' +
        '<div class="result-row"><span>Fark</span><span>' + fmt(c.fark) + ' mm</span></div>' +
        '<div class="result-row"><span>Etek Payı <span class="tag">' + state.fitting + '</span></span><span>+' + fmt(c.etek) + ' mm</span></div>' +
        '<div class="result-divider"></div>' +
        '<div class="result-hero"><span>Basım Ölçüsü</span><span class="result-hero-value">' + fmt(c.sonuc) + ' mm</span></div>' +
      '</div>';
    }
    return '<p class="screen-lead">Ölçüleri milimetre (mm) cinsinden girin.</p>' +
      '<label class="field"><span class="field-label">Soyulmuş Hortum Dış Çapı</span>' +
        '<span class="field-inputwrap"><input id="hortumDis" type="text" inputmode="decimal" placeholder="0,0" value="' + esc(state.hortumDis) + '" /><span class="field-suffix">mm</span></span>' +
      '</label>' +
      '<label class="field"><span class="field-label">Soket İç Çapı</span>' +
        '<span class="field-inputwrap"><input id="soketIc" type="text" inputmode="decimal" placeholder="0,0" value="' + esc(state.soketIc) + '" /><span class="field-suffix">mm</span></span>' +
      '</label>' +
      errorHtml +
      '<button class="btn-secondary calc-btn" data-action="calc">Hesapla</button>' +
      resultHtml;
  }

  function renderGauge(){
    var warning = state.gaugeWarning ? (
      '<div class="banner banner-danger"><span>Lütfen basımdan sonra rakor içini mastar ile ölçün.</span>' +
      '<button class="banner-dismiss" data-action="dismiss-warning">Tamam</button></div>'
    ) : '';
    return '<div class="confirm-screen">' +
      '<div class="confirm-icon">' + ICONS.gauge + '</div>' +
      '<div class="confirm-question">Rakor içerisinden mastar ile ölçtün mü?</div>' +
      warning +
      '<div class="confirm-actions">' +
        '<button class="btn-outline" data-action="gauge-no">Hayır</button>' +
        '<button class="btn-primary" data-action="gauge-yes">Evet</button>' +
      '</div>' +
    '</div>';
  }

  function renderPress(){
    if (state.pressStage === 'success') {
      return '<div class="outcome-screen outcome-success">' +
        '<div class="outcome-icon">' + ICONS.checkCircleBig + '</div>' +
        '<div class="outcome-title">TEBRİKLER!</div>' +
        '<div class="outcome-body">Mükemmel basımlara devam etmenizi dilerim.</div>' +
        '<button class="btn-primary" data-action="reset">Yeni Basıma Başla</button>' +
      '</div>';
    }
    if (state.pressStage === 'fail') {
      return '<div class="outcome-screen outcome-fail">' +
        '<div class="outcome-icon">' + ICONS.xCircleBig + '</div>' +
        '<div class="outcome-title">BASIM BAŞARISIZ</div>' +
        '<div class="outcome-body">Bu ürün hurdaya ayrılmalıdır.</div>' +
        '<button class="btn-primary" data-action="reset">Yeni Basıma Başla</button>' +
      '</div>';
    }
    return '<div class="confirm-screen">' +
      '<div class="confirm-icon">' + ICONS.gauge + '</div>' +
      '<div class="confirm-question">Basım başarılı mı?</div>' +
      '<div class="confirm-actions">' +
        '<button class="btn-outline" data-action="press-no">Hayır</button>' +
        '<button class="btn-primary" data-action="press-yes">Evet</button>' +
      '</div>' +
    '</div>';
  }

  var screenContent = document.getElementById('screenContent');
  var bottomBar = document.getElementById('bottomBar');
  var appTitle = document.getElementById('appTitle');
  var backBtn = document.getElementById('backBtn');
  var gearBtn = document.getElementById('gearBtn');
  var stepDotsEl = document.getElementById('stepDots');

  function render(){
    var meta = SCREEN_META[state.screen];
    appTitle.textContent = meta.title;
    backBtn.style.visibility = meta.back ? 'visible' : 'hidden';
    gearBtn.style.visibility = meta.gear ? 'visible' : 'hidden';
    stepDotsEl.innerHTML = stepDotsHtml(meta.step);

    var contentHtml = '', bottomHtml = '';
    switch (state.screen) {
      case 'home':
        contentHtml = renderHome();
        break;
      case 'brand':
        contentHtml = renderBrand();
        bottomHtml = '<button class="btn-primary" data-action="go-fitting"' + (!state.selectedBrand ? ' disabled' : '') + '>İleri</button>';
        break;
      case 'brandManage':
        contentHtml = renderBrandManage();
        break;
      case 'fitting':
        contentHtml = renderFitting();
        bottomHtml = '<button class="btn-primary" data-action="go-measure"' + (!state.fitting ? ' disabled' : '') + '>İleri</button>';
        break;
      case 'measure':
        contentHtml = renderMeasure();
        bottomHtml = '<button class="btn-primary" data-action="go-gauge"' + ((!state.calc || state.calcStale) ? ' disabled' : '') + '>Hortumu BAS</button>';
        break;
      case 'gauge':
        contentHtml = renderGauge();
        break;
      case 'press':
        contentHtml = renderPress();
        break;
    }
    screenContent.innerHTML = contentHtml;
    bottomBar.innerHTML = bottomHtml;
    bottomBar.classList.toggle('is-empty', !bottomHtml);
    screenContent.scrollTop = 0;
  }

  function doCalc(){
    var hd = parseNum(state.hortumDis);
    var si = parseNum(state.soketIc);
    if (!isFinite(hd) || !isFinite(si) || hd <= 0 || si <= 0) {
      state.measureError = "Lütfen her iki ölçüyü de 0'dan büyük bir sayı olarak girin.";
      state.calc = null;
      state.calcStale = false;
      render();
      return;
    }
    state.measureError = null;
    var etek = state.fitting === 'SIYIRMALI' ? 0.5 : 0.3;
    var fark = si - hd;
    state.calc = { fark: fark, etek: etek, sonuc: fark + etek };
    state.calcStale = false;
    render();
  }

  function addBrand(){
    var input = document.getElementById('newBrandInput');
    if (!input) return;
    var name = input.value.trim();
    if (!name) return;
    var exists = state.brands.some(function(b){ return b.localeCompare(name, 'tr', { sensitivity: 'base' }) === 0; });
    if (!exists) {
      state.brands.push(name);
      saveBrands(state.brands);
    }
    input.value = '';
  }
  function deleteBrand(name){
    state.brands = state.brands.filter(function(b){ return b !== name; });
    saveBrands(state.brands);
    if (state.selectedBrand === name) state.selectedBrand = null;
  }
  function resetState(){
    state.screen = 'home';
    state.selectedBrand = null;
    state.fitting = null;
    state.hortumDis = '';
    state.soketIc = '';
    state.measureError = null;
    state.calc = null;
    state.calcStale = false;
    state.gaugeWarning = false;
    state.pressStage = 'ask';
  }

  var phoneScreen = document.querySelector('.phone-screen');
  phoneScreen.addEventListener('click', function(e){
    if (e.target.closest('#backBtn')) {
      var meta = SCREEN_META[state.screen];
      if (meta.back) { state.screen = meta.back; render(); }
      return;
    }
    if (e.target.closest('#gearBtn')) {
      if (SCREEN_META[state.screen].gear) { state.screen = 'brandManage'; render(); }
      return;
    }
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl || actionEl.disabled) return;
    var action = actionEl.dataset.action;
    var value = actionEl.dataset.value;
    switch (action) {
      case 'go-brand': state.screen = 'brand'; render(); break;
      case 'select-brand': state.selectedBrand = value; render(); break;
      case 'go-fitting': if (state.selectedBrand) { state.screen = 'fitting'; render(); } break;
      case 'select-fitting':
        state.fitting = value; state.calc = null; state.calcStale = false; state.measureError = null;
        render();
        break;
      case 'go-measure': if (state.fitting) { state.screen = 'measure'; render(); } break;
      case 'calc': doCalc(); break;
      case 'go-gauge': if (state.calc && !state.calcStale) { state.screen = 'gauge'; state.gaugeWarning = false; render(); } break;
      case 'gauge-no': state.gaugeWarning = true; render(); break;
      case 'dismiss-warning': state.gaugeWarning = false; render(); break;
      case 'gauge-yes': state.screen = 'press'; state.pressStage = 'ask'; render(); break;
      case 'press-yes': state.pressStage = 'success'; render(); break;
      case 'press-no': state.pressStage = 'fail'; render(); break;
      case 'reset': resetState(); render(); break;
      case 'delete-brand': deleteBrand(value); render(); break;
      case 'add-brand': addBrand(); render(); break;
    }
  });
  phoneScreen.addEventListener('input', function(e){
    if (e.target.id === 'hortumDis' || e.target.id === 'soketIc') {
      state[e.target.id] = e.target.value;
      if (state.calc && !state.calcStale) {
        state.calcStale = true;
        var rc = screenContent.querySelector('.result-card');
        if (rc) rc.classList.add('is-stale');
        var goBtn = bottomBar.querySelector('[data-action="go-gauge"]');
        if (goBtn) goBtn.disabled = true;
      }
    }
  });
  phoneScreen.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.id === 'newBrandInput') { addBrand(); render(); }
  });

  var themeToggle = document.getElementById('themeToggle');
  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function paintThemeIcon(){
    var t = currentTheme();
    themeToggle.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    themeToggle.setAttribute('aria-pressed', String(t === 'dark'));
  }
  themeToggle.addEventListener('click', function(){
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    paintThemeIcon();
  });
  var savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  paintThemeIcon();

  render();
})();
</script>
</body>
</html>
